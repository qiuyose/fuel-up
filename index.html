<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fuel Up - 极简加油记录</title>
  
  <!-- iOS PWA 沉浸式运行与桌面图标配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="加油记录">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007AFF">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container" id="app">
    <!-- 顶部状态栏 -->
    <div class="header-bar">
      <div class="header-title-box">
        <h1>Fuel Up</h1>
        <div class="date-str" id="currentDateStr">加载中...</div>
      </div>
      <button class="btn-icon" onclick="openSettingsModal()" title="设置与备份">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- 顶部总览卡片 -->
    <div class="card">
      <div class="overview-grid">
        <div class="overview-item">
          <span class="lbl">累计总里程</span>
          <span class="val" id="statTotalMileage">0 km</span>
        </div>
        <div class="overview-item">
          <span class="lbl">最近百公里油耗</span>
          <span class="val" id="statAvgL100" style="color:var(--accent-green)">- L</span>
        </div>
        <div class="overview-item">
          <span class="lbl">本月累计花费</span>
          <span class="val" id="statMonthCost">¥0</span>
        </div>
      </div>
    </div>

    <!-- 主视图：加油记账 -->
    <div id="viewRecord">
      <!-- 当前位置与加油站名称 -->
      <div class="location-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="locationText">正在查找周边加油站...</span>
        <a class="location-edit-btn" onclick="editLocation()">切换/修改</a>
      </div>

      <!-- 表单主体卡片 -->
      <div class="card">
        <div class="section-title">1. 仪表盘里程采集</div>
        <div class="form-group">
          <div class="form-row">
            <div class="input-box">
              <label>当前总里程 (km)</label>
              <input type="number" inputmode="decimal" id="inputMileage" placeholder="例如：45800" oninput="onInputChanged()">
            </div>
            <!-- 仪表盘拍照按钮 -->
            <button class="cam-btn" onclick="triggerCamera('dashboard')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              拍仪表盘
            </button>
          </div>
          <div id="dashPhotoThumb" class="photo-preview-box"></div>
        </div>

        <div class="section-title" style="margin-top: 16px;">2. 油品与加油数据</div>
        <div class="form-group">
          <label style="font-size:12px;color:var(--text-muted);">选择油号</label>
          <div class="oil-selector">
            <button class="oil-chip active" onclick="selectOil(this, '92#')">92#</button>
            <button class="oil-chip" onclick="selectOil(this, '95#')">95#</button>
            <button class="oil-chip" onclick="selectOil(this, '98#')">98#</button>
            <button class="oil-chip" onclick="selectOil(this, '0#柴油')">0#柴油</button>
          </div>
        </div>

        <div class="form-group">
          <div class="form-row">
            <div class="input-box">
              <label>加油总金额 (元)</label>
              <input type="number" inputmode="decimal" step="0.01" id="inputAmount" placeholder="300" oninput="calcFuelData('amount')">
            </div>
            <div class="input-box">
              <label>单价 (元/升)</label>
              <input type="number" inputmode="decimal" step="0.01" id="inputPrice" placeholder="7.50" oninput="calcFuelData('price')">
            </div>
            <!-- 加油机拍照按钮 -->
            <button class="cam-btn" onclick="triggerCamera('meter')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              拍加油机
            </button>
          </div>
          <div id="meterPhotoThumb" class="photo-preview-box"></div>
        </div>

        <div class="form-group">
          <div class="input-box">
            <label>本次加油量 (升)</label>
            <input type="number" inputmode="decimal" step="0.01" id="inputVolume" placeholder="自动计算升数" oninput="calcFuelData('volume')">
          </div>
        </div>

        <!-- 实用特性：加满跳枪开关 -->
        <div class="switch-row">
          <div class="switch-label">
            本次是否加满 (跳枪)
            <small>默认开启，只有加满才能精确测算每箱油真实油耗</small>
          </div>
          <input type="checkbox" id="switchFull" class="ios-switch" checked onchange="onInputChanged()">
        </div>

        <!-- 实用特性：优惠折扣记录 -->
        <div class="form-group" style="margin-top: 12px;">
          <div class="input-box">
            <label>实付金额 / 优惠折扣 (选填，如有满减立减)</label>
            <input type="number" inputmode="decimal" step="0.01" id="inputActualPay" placeholder="若有优惠可填最终实付金额" oninput="onInputChanged()">
          </div>
        </div>

        <!-- 即时演算结果卡片 -->
        <div class="calc-preview">
          <div class="calc-row">
            <span>自上次加油行驶续航：</span>
            <span class="num" id="previewTrip">-- km</span>
          </div>
          <div class="calc-row">
            <span>本次核算百公里油耗：</span>
            <span class="num" id="previewL100">-- L/100km</span>
          </div>
          <div class="calc-row">
            <span>每公里用车成本：</span>
            <span class="num" id="previewPerKm">-- 元/km</span>
          </div>
        </div>

        <!-- 保存按钮 -->
        <button class="btn-submit" onclick="saveRecord()">完成并保存记录</button>
      </div>
    </div>

    <!-- 历史明细视图 -->
    <div id="viewHistory" style="display: none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span class="section-title" style="margin:0;">历史加油明细</span>
        <div>
          <button class="cam-btn" style="height:34px; font-size:12px;" onclick="exportCSV()">导出 CSV 表格</button>
        </div>
      </div>
      <div id="historyListContainer">
        <!-- 动态历史数据卡片 -->
      </div>
    </div>
  </div>

  <!-- 隐藏的文件输入组件 -->
  <input type="file" id="cameraDashboard" class="hidden-input" accept="image/*" capture="environment" onchange="handleImageCaptured(this, 'dashboard')">
  <input type="file" id="cameraMeter" class="hidden-input" accept="image/*" capture="environment" onchange="handleImageCaptured(this, 'meter')">

  <!-- 底部导航栏 -->
  <div class="tab-bar">
    <div class="tab-item active" id="tabBtnRecord" onclick="switchTab('record')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <span>快速记账</span>
    </div>
    <div class="tab-item" id="tabBtnHistory" onclick="switchTab('history')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>历史与统计</span>
    </div>
  </div>

  <!-- 设置与备份弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-title">系统配置与数据管理</div>
      
      <!-- 快捷预设按钮 -->
      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <button type="button" class="cam-btn" style="flex:1; height:32px; font-size:11px; justify-content:center;" onclick="setPresetConfig('siliconflow')">
          一键填硅基流动
        </button>
        <button type="button" class="cam-btn" style="flex:1; height:32px; font-size:11px; justify-content:center;" onclick="setPresetConfig('openai')">
          一键填 OpenAI
        </button>
      </div>

      <div class="form-group">
        <label style="font-size:12px;color:var(--text-muted)">高德地图 Key (选填，检索周边加油站)</label>
        <input type="text" id="settingAmapKey" placeholder="高德开放平台申请的 Web服务 Key">
        <small style="display:block;font-size:11px;color:var(--text-muted);margin-top:4px;">
          填入后，进站自动按距离推荐最近加油站并可一键切换。
        </small>
      </div>

      <div class="form-group">
        <label style="font-size:12px;color:var(--text-muted)">AI 识图 API Key (选填)</label>
        <input type="text" id="settingApiKey" placeholder="sk-...">
      </div>

      <div class="form-group">
        <label style="font-size:12px;color:var(--text-muted)">服务地址 (Base URL)</label>
        <input type="text" id="settingBaseUrl" placeholder="https://api.siliconflow.cn/v1">
      </div>

      <div class="form-group">
        <label style="font-size:12px;color:var(--text-muted)">识图视觉模型名称 (Model)</label>
        <input type="text" id="settingModel" placeholder="Qwen/Qwen2-VL-7B-Instruct">
      </div>

      <div class="form-group">
        <label style="font-size:12px;color:var(--text-muted)">基准初始总里程 (km)</label>
        <input type="number" id="settingBaseMileage" placeholder="例如：45000">
      </div>

      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="cam-btn" style="flex:1; justify-content:center;" onclick="exportJSON()">备份数据</button>
        <button class="cam-btn" style="flex:1; justify-content:center;" onclick="document.getElementById('importFileInput').click()">恢复数据</button>
        <input type="file" id="importFileInput" class="hidden-input" accept=".json" onchange="importJSON(this)">
      </div>

      <button class="btn-submit" style="margin-top:16px; height:44px; font-size:15px;" onclick="closeSettingsModal()">保存并生效</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
