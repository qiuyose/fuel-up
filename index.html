<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fuel Up - 极简加油记录</title>
  
  <!-- iOS PWA 沉浸式运行与桌面图标配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="加油记录">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261021">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=20261021">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=20261021">
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=20261021">
  <link rel="manifest" href="manifest.json?v=20261021">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="style.css?v=20261023_fast">
</head>
<body style="background-color: #F2F2F7;">

  <!-- iOS PWA 原生手感下拉刷新指示器 -->
  <div id="ptrIndicator">
    <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
    <div class="ptr-spinner"></div>
    <span id="ptrText">下拉刷新</span>
  </div>

  <div class="container" id="app">
    <!-- 顶部状态栏 -->
    <div class="header-bar">
      <div class="header-title-box">
        <h1>Fuel Up</h1>
        <div class="date-str" id="currentDateStr">加载中...</div>
      </div>
      <div class="header-actions">
        <!-- 一键强制刷新按钮 -->
        <button class="btn-icon" onclick="forceUpdateApp()" title="刷新应用与定位">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>
        <!-- 设置按钮 -->
        <button class="btn-icon" onclick="openSettingsModal()" title="设置与备份">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <!-- 顶部总览卡片 -->
    <div class="card">
      <div class="overview-grid">
        <div class="overview-item">
          <span class="lbl">累计总里程</span>
          <span class="val" id="statTotalMileage">0 km</span>
        </div>
        <div class="overview-item">
          <span class="lbl">最近百公里油耗</span>
          <span class="val" id="statAvgL100" style="color:var(--accent-green)">- L</span>
        </div>
        <div class="overview-item">
          <span class="lbl">本月累计花费</span>
          <span class="val" id="statMonthCost">¥0</span>
        </div>
      </div>
    </div>

    <!-- 主视图：加油记账 -->
    <div id="viewRecord">
      <!-- 当前位置与加油站名称 -->
      <div class="location-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="locationText">正在查找周边加油站...</span>
        <a class="location-edit-btn" onclick="editLocation()">切换/修改</a>
      </div>

      <!-- 表单主体卡片 -->
      <div class="card">
        <div class="section-title">1. 仪表盘里程采集</div>
        <div class="form-group">
          <div class="form-row">
            <div class="input-box">
              <label>当前总里程 (km)</label>
              <input type="number" inputmode="decimal" id="inputMileage" placeholder="例如：45800" oninput="onInputChanged()">
            </div>
            <!-- 仪表盘拍照按钮 -->
            <button class="cam-btn" onclick="triggerCamera('dashboard')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              拍仪表盘
            </button>
          </div>
          <div id="dashPhotoThumb" class="photo-preview-box"></div>
        </div>

        <div class="section-title" style="margin-top: 16px;">2. 油品与加油数据</div>
        <div class="form-group">
          <label style="font-size:12px;color:var(--text-muted);">选择油号</label>
          <div class="oil-selector">
            <button class="oil-chip active" onclick="selectOil(this, '92#')">92#</button>
            <button class="oil-chip" onclick="selectOil(this, '95#')">95#</button>
            <button class="oil-chip" onclick="selectOil(this, '98#')">98#</button>
            <button class="oil-chip" onclick="selectOil(this, '0#柴油')">0#柴油</button>
          </div>
        </div>

        <div class="form-group">
          <div class="form-row">
            <div class="input-box">
              <label>加油总金额 (元)</label>
              <input type="number" inputmode="decimal" step="0.01" id="inputAmount" placeholder="300" oninput="calcFuelData('amount')">
            </div>
            <div class="input-box">
              <label>单价 (元/升)</label>
              <input type="number" inputmode="decimal" step="0.01" id="inputPrice" placeholder="7.50" oninput="calcFuelData('price')">
            </div>
            <!-- 加油机拍照按钮 -->
            <button class="cam-btn" onclick="triggerCamera('meter')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              拍加油机
            </button>
          </div>
          <div id="meterPhotoThumb" class="photo-preview-box"></div>
        </div>

        <div class="form-group">
          <div class="input-box">
            <label>本次加油量 (升)</label>
            <input type="number" inputmode="decimal" step="0.01" id="inputVolume" placeholder="自动计算升数" oninput="calcFuelData('volume')">
          </div>
        </div>

        <!-- 实用特性：加满跳枪开关 -->
        <div class="switch-row">
          <div class="switch-label">
            本次是否加满 (跳枪)
            <small>默认开启，只有加满才能精确测算每箱油真实油耗</small>
          </div>
          <input type="checkbox" id="switchFull" class="ios-switch" checked onchange="onInputChanged()">
        </div>

        <!-- 实用特性：优惠折扣记录 -->
        <div class="form-group" style="margin-top: 12px;">
          <div class="input-box">
            <label>实付金额 / 优惠折扣 (选填，如有满减立减)</label>
            <input type="number" inputmode="decimal" step="0.01" id="inputActualPay" placeholder="若有优惠可填最终实付金额" oninput="onInputChanged()">
          </div>
        </div>

        <!-- 即时演算结果卡片 -->
        <div class="calc-preview">
          <div class="calc-row">
            <span>自上次加油行驶续航：</span>
            <span class="num" id="previewTrip">-- km</span>
          </div>
          <div class="calc-row">
            <span>本次核算百公里油耗：</span>
            <span class="num" id="previewL100">-- L/100km</span>
          </div>
          <div class="calc-row">
            <span>每公里用车成本：</span>
            <span class="num" id="previewPerKm">-- 元/km</span>
          </div>
        </div>

        <!-- 保存按钮 -->
        <button class="btn-submit" onclick="saveRecord()">完成并保存记录</button>
      </div>
    </div>

    <!-- 历史明细视图 -->
    <div id="viewHistory" style="display: none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span class="section-title" style="margin:0;">历史加油明细</span>
        <div>
          <button class="cam-btn" style="height:34px; font-size:12px;" onclick="exportCSV()">导出 CSV 表格</button>
        </div>
      </div>
      <div id="historyListContainer">
        <!-- 动态历史数据卡片 -->
      </div>
    </div>
  </div>

  <!-- 隐藏的文件输入组件 -->
  <input type="file" id="cameraDashboard" class="hidden-input" accept="image/*" capture="environment" onchange="handleImageCaptured(this, 'dashboard')">
  <input type="file" id="cameraMeter" class="hidden-input" accept="image/*" capture="environment" onchange="handleImageCaptured(this, 'meter')">

  <!-- Apple 原生 Liquid Glass 悬浮双体工具栏 (胶囊主栏 + 独立圆形配置按钮) -->
  <div class="dock-container">
    <nav class="liquid-dock">
      <div class="tab-item active" id="tabBtnRecord" onclick="switchTab('record')">
        <svg viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 0 0 2.5 2.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14a2 2 0 0 0-2-2h-1V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16h10v-7.5h1.5v4.5a2.5 2.5 0 0 0 5 0V9a2 2 0 0 0-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        <span>快速记账</span>
      </div>
      <div class="tab-item" id="tabBtnHistory" onclick="switchTab('history')">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-5h5v5zm0-7H7V7h5v3zm6 7h-4v-9h4v9zm0-11h-4V7h4v2z"/></svg>
        <span>历史与统计</span>
      </div>
    </nav>
    
  </div>

  <!-- 设置与备份弹窗 -->
  <div class="modal-overlay" id="settingsModal" onclick="handleModalOverlayClick(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <!-- 弹窗标题与右上角 X 关闭按钮 (吸顶固定，永不被遮挡) -->
      <div class="modal-header">
        <div class="modal-title">系统配置与数据管理</div>
        <button type="button" class="modal-close-btn" onclick="dismissSettingsModal()" title="直接关闭">✕</button>
      </div>

      <!-- 弹窗内部独立滚动主体 (支持顺畅向下滑动) -->
      <div class="modal-body">
        <!-- 通用视觉大模型配置模块 -->
        <div style="background:rgba(120, 120, 128, 0.06); border-radius:14px; padding:12px; margin-bottom:12px;">
          <div class="form-group" style="margin-bottom:8px;">
            <label style="font-size:12px;color:var(--text-muted);font-weight:600;">API 服务地址 (Base URL)</label>
            <input type="text" id="settingBaseUrl" placeholder="例如：https://api.siliconflow.cn/v1" style="height:38px;font-size:13px;">
          </div>

          <div class="form-group" style="margin-bottom:8px;">
            <div class="label-row">
              <label style="font-size:12px;color:var(--text-muted);font-weight:600;">API Key (密钥)</label>
              <span id="badgeApiStatus" class="badge-status-configured" style="display:none;">已配置</span>
            </div>
            <div class="input-with-eye">
              <input type="password" id="settingApiKey" placeholder="sk-..." onfocus="handleKeyFocus(this)" onblur="handleKeyBlur(this)" style="height:38px;font-size:13px;">
              <button type="button" class="btn-eye" onclick="togglePasswordVisibility('settingApiKey')" title="显示/隐藏明文">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:0;">
            <div class="label-row">
              <label style="font-size:12px;color:var(--text-muted);font-weight:600;">视觉模型选择</label>
              <span id="modelCountBadge" style="font-size:11px;color:var(--primary);font-weight:600;"></span>
            </div>
            
            <!-- 核心供应商快速分类（千问/智谱/全部） -->
            <div style="display:flex; gap:6px; margin-bottom:8px;">
              <button type="button" class="vendor-chip active" id="btnVendorQwen" onclick="switchVendor('qwen')">千问 (Qwen)</button>
              <button type="button" class="vendor-chip" id="btnVendorGlm" onclick="switchVendor('glm')">智谱 (GLM)</button>
              <button type="button" class="vendor-chip" id="btnVendorAll" onclick="switchVendor('all')">全部视觉</button>
            </div>

            <div class="label-row" style="margin-top:4px;">
              <label style="font-size:11px;color:var(--text-muted)">在线模型列表</label>
              <button type="button" onclick="fetchOnlineModels(true)" style="background:none;border:none;color:var(--primary);font-size:12px;font-weight:600;cursor:pointer;">
                🔄 实时拉取上游模型
              </button>
            </div>
            <select id="selectDynamicModel" class="ios-select" style="height:38px;font-size:13px;" onchange="onDynamicModelChanged(this.value)">
              <option value="">点击上方“实时拉取”获取列表</option>
            </select>

            <input type="text" id="settingModel" placeholder="当前生效的模型ID" style="margin-top:6px;height:38px;font-size:13px;">
            <small style="display:block;font-size:11px;color:var(--text-muted);margin-top:4px;">
              填写服务地址后点击“实时拉取”，直接在下拉框点选即可生效。
            </small>
          </div>
        </div>

        <!-- 高德地图 Web 服务 Key 配置 -->
        <div style="background:rgba(120, 120, 128, 0.06); border-radius:14px; padding:12px; margin-bottom:12px;">
          <div class="form-group" style="margin-bottom:0;">
            <div class="label-row">
              <label style="font-size:12px;color:var(--text-muted);font-weight:600;">高德 Web 服务 Key (定位加油站)</label>
              <span id="badgeAmapStatus" class="badge-status-configured" style="display:none;">已配置</span>
            </div>
            <div class="input-with-eye">
              <input type="password" id="settingAmapKey" placeholder="高德开放平台申请的 Web服务 Key" onfocus="handleKeyFocus(this)" onblur="handleKeyBlur(this)" style="height:38px;font-size:13px;">
              <button type="button" class="btn-eye" onclick="togglePasswordVisibility('settingAmapKey')" title="显示/隐藏明文">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <small style="display:block;font-size:11px;color:var(--text-muted);margin-top:4px;">
              用于自动识别当前所在加油站名称与距离。
            </small>
          </div>
        </div>

        <!-- 基准初始里程 -->
        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;">基准初始总里程 (km)</label>
          <input type="number" id="settingBaseMileage" placeholder="例如：12500 (第一笔记录前的里程)" style="height:38px;font-size:13px;">
          <small style="display:block;font-size:11px;color:var(--text-muted);margin-top:4px;">用于第一笔记录准确核算续航与油耗。</small>
        </div>

        <!-- 数据备份与迁移 -->
        <div style="margin-bottom:14px;">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:6px;">本地数据备份与迁移</label>
          <div style="display:flex; gap:8px;">
            <button type="button" class="cam-btn" style="flex:1; height:36px; font-size:12px;" onclick="exportJSON()">📦 备份数据</button>
            <label class="cam-btn" style="flex:1; height:36px; font-size:12px; margin:0; display:flex; align-items:center; justify-content:center; cursor:pointer;">
              📥 恢复备份
              <input type="file" accept=".json" class="hidden-input" onchange="importJSON(this)">
            </label>
          </div>
        </div>

        <!-- 保存并生效按钮 -->
        <button class="btn-submit" onclick="closeSettingsModal()" style="margin-top:4px;">保存并生效</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
